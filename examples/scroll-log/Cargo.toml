[package]
name = "scroll-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "End-to-end example: TuiApp composing styles + wrap + hyperlink + spinner + scrollview"
publish = false

[[bin]]
name = "scroll-log"
path = "src/main.rs"

[dependencies]
# The umbrella — pulling all five borrow-debris sibling cargo features.
# This is the first end-to-end consumer that exercises the entire
# shipped crate set as a single TuiApp.
#
# Path-only (no `workspace = true`) to sidestep the version mismatch
# between tornado's declared `0.1.0` and the workspace's `0.2.99`
# pin — the same path is resolved, but path-deps do not trigger the
# workspace SemVer check.
tornado = { path = "../../crates/tornado", features = [
    "styles",
    "wrap",
    "hyperlink",
    "spinner",
    "scroller",
] }
# Pattern-matching on KeyCode / KeyModifiers — not re-exported by tornado.
# Declared directly (not via workspace) to avoid pinning the
# workspace-level manifest.
crossterm = "0.28"
# ratatui's TestBackend is in the default feature set, but the example
# declares the dep explicitly so it shows up in `cargo tree` for the
# downstream consumer.
ratatui = { workspace = true }

[dev-dependencies]
# ratatui's TestBackend for smoke-testing the render path without a real
# terminal. No extra feature needed in 0.30.
ratatui = { workspace = true }
