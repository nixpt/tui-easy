[package]
name = "scroll-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "End-to-end example: TuiApp composing styles + wrap + hyperlink + spinner + scrollview"
publish = false

[[bin]]
name = "scroll-log"
path = "src/main.rs"

[dependencies]
# Round 9 — the per-tab scroll mechanics come from
# `tui-easy::tab_log::TabLog`, gated behind the `log_view` umbrella
# feature (which transitively pulls in styles + scroller + wrap).
# `spinner` is declared explicitly because the title bar still
# drives a `SpinnerState` directly. `wrap` is in because the inline
# smoke test exercises `tui-easy::wrap::word_wrap_line` directly;
# without enabling the feature, the `#[cfg(test)] mod tests` path
# fails to compile with E0433.
tui-easy = { workspace = true, features = [
    "log_view",
    "spinner",
    "wrap",
] }
# Pattern-matching on KeyCode / KeyModifiers — not re-exported by tui-easy.
crossterm = "0.28"
# ratatui's TestBackend is in the default feature set, but the example
# declares the dep explicitly so it shows up in `cargo tree` for the
# downstream consumer.
ratatui = { workspace = true }

[dev-dependencies]
# ratatui's TestBackend for smoke-testing the render path without a real
# terminal. No extra feature needed in 0.30.
ratatui = { workspace = true }
