[package]
name = "multi-tab-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Round 8 example: multi-tab log consumer composing round-9 TabLog helper + tornado::widget::TabNav (round-6 catch-up funneled through the umbrella)"
publish = false

[[bin]]
name = "multi-tab-log"
path = "src/main.rs"

[dependencies]
# Round 8 example consuming six umbrella features together:
#   - `log_view` — round-9 TabLog helper.
#   - `spinner`  — global SpinnerState in the title bar.
#   - `wrap`     — exercises the inline smoke test for `word_wrap_line`.
#   - `hyperlink` — OSC 8 anchor rendering for the per-row URLs.
#   - `styles`   — `HyperlinkTarget` plumbing shared with TabLog.
#   - `tabs`     — round-6 catch-up: `tornado::widget::TabNav`
#                  replaced the round-8 Path-B direct import.
tornado = { workspace = true, features = [
    "log_view",
    "spinner",
    "wrap",
    "hyperlink",
    "styles",
    "tabs",
] }
# Pattern-matching on KeyCode / KeyModifiers — not re-exported by tornado.
crossterm = "0.28"
# ratatui is a transitive dep of tornado, but declared explicitly here
# so `cargo tree -p multi-tab-log` shows the upstream type surface
# (`Tabs`, `Layout`, `Paragraph`, `Frame`, `Buffer`, etc.) under the
# example's own node.
ratatui = { workspace = true }

[dev-dependencies]
# ratatui's TestBackend for smoke-testing the render path without a
# real terminal. No extra feature needed in 0.30.
ratatui = { workspace = true }
