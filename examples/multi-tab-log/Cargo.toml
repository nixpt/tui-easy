[package]
name = "multi-tab-log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
# Round-10 description update: the round-8 example retains its
# role as the single end-to-end consumer composing every vendored
# sibling + the round-9 TabLog helper. The round-10 mutation slots
# a 12-col Sparkline into the right flank of the existing 2-row
# status_bar — no layout shift, just a new rolling-c spark metric
# visible alongside the text footer.
description = "Round 8/10 example: multi-tab log consumer composing round-9 TabLog helper + tui-easy::widget::TabNav + round-10 Sparkline in status_bar footer"
publish = false

[[bin]]
name = "multi-tab-log"
path = "src/main.rs"

[dependencies]
# Round 8 example consuming the umbrella features together (round 10
# adds the seventh):
#   - `log_view` — round-9 TabLog helper.
#   - `spinner`  — global SpinnerState in the title bar.
#   - `wrap`     — exercises the inline smoke test for `word_wrap_line`.
#   - `hyperlink` — OSC 8 anchor rendering for the per-row URLs.
#   - `styles`   — `HyperlinkTarget` plumbing shared with TabLog.
#   - `tabs`     — round-6 catch-up: `tui-easy::widget::TabNav`.
#   - `sparkline` — round-10: 12-col Sparkline slotted into the
#                  right flank of the existing 2-row status_bar
#                  footer (per round-10 design memo D5/D9). The
#                  widget shows the rolling row-append cadence
#                  of the active tab over the last ~12 frames.
tui-easy = { workspace = true, features = [
    "log_view",
    "spinner",
    "wrap",
    "hyperlink",
    "styles",
    "tabs",
    "sparkline",
] }
# Pattern-matching on KeyCode / KeyModifiers — not re-exported by tui-easy.
crossterm = "0.28"
# ratatui is a transitive dep of tui-easy, but declared explicitly here
# so `cargo tree -p multi-tab-log` shows the upstream type surface
# (`Tabs`, `Layout`, `Paragraph`, `Frame`, `Buffer`, etc.) under the
# example's own node.
ratatui = { workspace = true }

[dev-dependencies]
# ratatui's TestBackend for smoke-testing the render path without a
# real terminal. No extra feature needed in 0.30.
ratatui = { workspace = true }
