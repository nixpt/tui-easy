[package]
name = "tui-easy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared terminal UI shell — terminal init, event loop, themes, widgets"
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.28"
ratatui = "0.30"
tracing = "0.1"
# Optional — small ANSI/ratatui bridge helpers + HyperlinkTarget type,
# borrowed from xai-grok-markdown. Only added when the `styles` feature
# is enabled, so consumers that don't need them don't pay for them.
tui-easy-styles = { workspace = true, optional = true }
# Optional — textwrap word-wrap helpers over ratatui Line/Span,
# borrowed from xai-ratatui-textarea. Gated behind the `wrap` feature
# (and pulls in `textwrap` transitively).
tui-easy-wrap = { workspace = true, optional = true }
# Optional — OSC 8 hyperlink widget for ratatui, from the
# hyperrat crate (dual MIT/Unlicense). Gated behind the
# `hyperlink` feature. Replaces the vendored `tui-easy-hyperlink`.
hyperrat = { workspace = true, optional = true }
# Optional — bubbletea-inspired spinner widget for ratatui, from the
# ratatui-cheese crate (MIT). Gated behind the `spinner` feature.
# Replaces the vendored `tui-easy-spinner`. The widget's
# `SpinnerState::tick(Duration)` accepts the elapsed time of one
# `run_app` loop iteration and advances frames at the cadence defined
# by `SpinnerType::interval`.
ratatui-cheese = { workspace = true, optional = true }
# Optional — stateful scrolling view for ratatui, from the
# tui-scrollview crate (Josh McKinney, dual MIT/Apache-2.0). Gated
# behind the `scroller` feature. Replaces the vendored
# `tui-easy-scrollview`.
tui-scrollview = { workspace = true, optional = true }
# Optional — Tabs widget for ratatui. Since ratatui 0.30
# provides `ratatui::widgets::Tabs` natively, this feature
# simply re-exports it as `TabNav` (no vendored dep needed).
# The `tabs` feature is kept as an empty feature for backward
# compatibility with existing consumers.
# Optional — Sparkline widget. `ratatui::widgets::Sparkline` is
# always available (ratatui is a hard dep); the `sparkline` feature
# is an empty gate for backward compatibility with existing
# consumers that enable it. Replaces the vendored `tui-easy-sparkline`.
# Optional — List widget. `ratatui::widgets::{List, ListState}` are
# always available (ratatui is a hard dep); the `list` feature is an
# empty gate for backward compatibility. Replaces the vendored
# `tui-easy-list`. Note: `List::new(items)` accepts `Vec<Text>` via
# `Into<ListItem>`, so the consumer-facing API is identical.
# Optional — Popup widget from the tui-popup crate (MIT).
# A simple popup with bordered box, title, body text, and optional
# drag-repositioning. Gated behind the `popup` feature.
# Replaces the vendored `tui-easy-popup`.
tui-popup = { workspace = true, optional = true }
# Optional — BigText widget from tui-big-text (MIT/Apache-2.0).
# Renders large pixel text using font8x8 glyphs. Gated behind the
# `big-text` feature. Replaces the vendored `tui-easy-big-text`.
# Consumers access `BigText` and `PixelSize` via
# `tui-easy::widget::{BigText, PixelSize}` or the module re-export
# `tui-easy::big_text`.
tui-big-text = { workspace = true, optional = true }
# Optional — Tree widget from the tui-tree-widget crate (MIT).
# A stateful tree widget with selection, folding, and scrollbar support.
# Gated behind the `tree` feature. Replaces the vendored
# `tui-easy-tree-widget`.
tui-tree-widget = { workspace = true, optional = true }
# Optional — original BarChart/Bar/BarGroup widget (round-12). No
# upstream replacement pattern applies here (unlike tabs/sparkline/list,
# this isn't a thin re-export of a `ratatui::widgets` type). Gated
# behind the `barchart` feature.
tui-easy-barchart = { workspace = true, optional = true }
# Optional — vendored TextArea + TextAreaState from xai-ratatui-textarea
# (Apache-2.0). ratatui ships no built-in text-area widget, so unlike
# tabs/sparkline/list there's no upstream re-export path here either.
# Gated behind the `textinput` feature.
tui-easy-textinput = { workspace = true, optional = true }

[features]
default = []
styles = ["dep:tui-easy-styles"]
wrap = ["dep:tui-easy-wrap"]
hyperlink = ["dep:hyperrat"]
spinner = ["dep:ratatui-cheese"]
scroller = ["dep:tui-scrollview"]
tabs = []
# Sparkline widget — empty gate. `ratatui::widgets::Sparkline` is
# always available (ratatui is a hard dep). Kept for backward compat.
sparkline = []
# List widget — empty gate. `ratatui::widgets::{List, ListState}` are
# always available. Kept for backward compat.
list = []
# Popup widget from the tui-popup crate (MIT).
popup = ["dep:tui-popup"]
# BigText widget from the tui-big-text crate (MIT/Apache-2.0).
big-text = ["dep:tui-big-text"]
# Tree widget from the tui-tree-widget crate (MIT).
tree = ["dep:tui-tree-widget"]
# Original BarChart/Bar/BarGroup widget (round-12).
barchart = ["dep:tui-easy-barchart"]
# Vendored TextArea + TextAreaState from xai-ratatui-textarea (round-13).
textinput = ["dep:tui-easy-textinput"]
# Log view: aggregates styles + scroller + wrap to expose
# `tui-easy::tab_log::TabLog` — per-tab scroll log helper.
log_view = [
    "dep:tui-easy-styles",
    "dep:tui-scrollview",
    "dep:tui-easy-wrap",
]

# Integration tests — each gated on the feature it exercises, so
# consumers who don't enable that feature don't pay for the test
# (and the test's dependencies).

# tui-easy-styles: round-1 anstyle -> ratatui roundtrip.
[[test]]
name = "styles_integration"
required-features = ["styles"]

# tui-easy-hyperlink: OSC 8 encoding reach-through (cell 0 prefix).
[[test]]
name = "hyperlink_integration"
required-features = ["hyperlink"]

# tui-easy-spinner: frame advance via tick + StatefulWidget render path.
[[test]]
name = "spinner_integration"
required-features = ["spinner"]

# tui-easy-scrollview: offset advance + scrollbar visibility policy +
# viewport slicing through `tui-easy::scroller` re-export.
[[test]]
name = "scrollview_integration"
required-features = ["scroller"]

# tui-easy-barchart / tui-easy-textinput integration tests live inside
# those sibling crates' own `tests/` directories, exercised via
# `cargo test -p tui-easy-barchart -p tui-easy-textinput`.

# TabLog unit-tests live inside `crates/tui-easy/src/tab_log.rs`
# (inline `#[cfg(test)] mod tests`). Exercised at module level.

# Multi-tab-log example exercises tabs, sparkline, spinner,
# scroller, and hyperlink end-to-end.
