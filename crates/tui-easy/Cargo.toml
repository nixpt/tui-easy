[package]
name = "tornado"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared terminal UI shell — terminal init, event loop, themes, widgets"
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.28"
ratatui = "0.30"
tracing = "0.1"
# Optional — small ANSI/ratatui bridge helpers + HyperlinkTarget type,
# borrowed from xai-grok-markdown. Only added when the `styles` feature
# is enabled, so consumers that don't need them don't pay for them.
tornado-styles = { workspace = true, optional = true }
# Optional — textwrap word-wrap helpers over ratatui Line/Span,
# borrowed from xai-ratatui-textarea. Gated behind the `wrap` feature
# (and pulls in `textwrap` transitively).
tornado-wrap = { workspace = true, optional = true }
# Optional — OSC 8 hyperlink widget for ratatui, vendored from hyperrat
# (dual MIT/Unlicense). Gated behind the `hyperlink` feature.
tornado-hyperlink = { workspace = true, optional = true }
# Optional — bubbletea-inspired spinner widget for ratatui, vendored from
# ratatui-cheese (MIT). Gated behind the `spinner` feature. The widget's
# `SpinnerState::tick(Duration)` accepts the elapsed time of one
# `run_app` loop iteration (the `tick_rate`) and advances frames at the
# cadence defined by `SpinnerType::interval`.
tornado-spinner = { workspace = true, optional = true }
# Optional — stateful scrolling view for ratatui, vendored from
# tui-scrollview v0.6.7 (Josh McKinney, dual MIT/Apache-2.0). Gated
# behind the `scroller` feature.
tornado-scrollview = { workspace = true, optional = true }
# Optional — Tabs widget for ratatui, vendored from
# ratatui 0.30 itself (Florian Dehau + ratatui contributors,
# dual MIT/Apache-2.0). Gated behind the `tabs` feature. See
# `crates/tornado-tabs/NOTICE` for the license-mirror attribution.
tornado-tabs = { workspace = true, optional = true }
# Optional — Sparkline + SparklineBar widget for ratatui,
# vendored from ratatui 0.30 itself (dual MIT/Apache-2.0).
# The widget is fully **stateless** — only a `Widget` impl
# is vendored (no `SparklineState` upstream). Composition with
# the existing `status_bar` (`tornado::widget::status_bar`) is
# the headlining use case. Gated behind the `sparkline`
# feature. See `crates/tornado-sparkline/NOTICE` for the
# license-mirror attribution.
tornado-sparkline = { workspace = true, optional = true }
# Optional — vendored List + StatefulWidget for List + ListState
# from ratatui 0.30 itself (dual MIT/Apache-2.0). Gated behind the
# `list` feature. This is the canonical StatefulWidget vendoring
# precedent — BOTH trait impls vendored together (no carve-out
# like round-6 Tabs). See `crates/tornado-list/NOTICE` for the
# license-mirror attribution. Consumers access `List` and
# `ListState` via `tornado::widget::{List, ListState}` or the
# module re-export `tornado::list`.
tornado-list = { workspace = true, optional = true }
# Optional — vendored Popup widget from joshka/tui-popup (MIT).
# A simple popup with bordered box, title, body text, and optional
# drag-repositioning. Gated behind the `popup` feature.
# Consumers access `Popup` and `PopupState` via
# `tornado::widget::{Popup, PopupState}` or the module re-export
# `tornado::popup`. See `crates/tornado-popup/NOTICE` for the
# license-mirror attribution.
tornado-popup = { workspace = true, optional = true }
# Optional — vendored BigText widget from joshka/tui-big-text
# (MIT/Apache-2.0). Renders large pixel text using 8x8 font glyphs
# (font8x8 crate). Gated behind the `big-text` feature.
# Consumers access `BigText` and `PixelSize` via
# `tornado::widget::{BigText, PixelSize}` or the module re-export
# `tornado::big_text`.
tornado-big-text = { workspace = true, optional = true }
# Optional — vendored Tree widget from EdJoPaTo/tui-rs-tree-widget (MIT).
# A stateful tree widget with selection, folding, and scrollbar support.
# Gated behind the `tree` feature. Consumers access `Tree`, `TreeItem`,
# `TreeState`, and `Flattened` via `tornado::widget::{Tree, TreeItem, ...}`
# or the module re-export `tornado::tree`.
tornado-tree-widget = { workspace = true, optional = true }

[features]
default = []
styles = ["dep:tornado-styles"]
wrap = ["dep:tornado-wrap"]
hyperlink = ["dep:tornado-hyperlink"]
spinner = ["dep:tornado-spinner"]
scroller = ["dep:tornado-scrollview"]
tabs = ["dep:tornado-tabs"]
# Round 10 — vendored Sparkline + SparklineBar behind a
# `sparkline` feature. The smallest surface of any vendored
# sibling (no StatefulWidget, no SparklineState) — chosen by
# the round-10 design memo for the lowest vendoring lift.
# Composition target: round-10 example slots a 12-col Sparkline
# into the right flank of the existing 2-row status_bar footer.
sparkline = ["dep:tornado-sparkline"]
# Round 11 — vendored List + StatefulWidget behind a `list`
# feature. The canonical StatefulWidget vendoring precedent
# (D2 round-11 design memo). BOTH trait impls vendored together;
# see `crates/tornado-list/src/lib.rs` for the E0034 carve-out
# pattern (fully-qualified trait-method call for disambiguation
# when both `Widget` and `StatefulWidget` are in scope at the
# consumer call site).
list = ["dep:tornado-list"]
# Round 12 — vendored Popup widget behind a `popup` feature.
# A simple popup with bordered box, title, body text, and optional
# drag-repositioning. The widget implements both `Widget` (stateless)
# and `StatefulWidget` (stateful with `PopupState`) on `&Popup`.
# See `crates/tornado-popup/src/lib.rs` for the API surface.
popup = ["dep:tornado-popup"]
# Round 13 — vendored BigText widget behind a `big-text` feature.
# Renders large pixel text using the font8x8 bitmap font. The widget
# implements `Widget for BigText` (stateless — no StatefulWidget).
# See `crates/tornado-big-text/src/lib.rs` for the API surface.
big-text = ["dep:tornado-big-text"]
# Round 14 — vendored Tree widget behind a `tree` feature.
# A stateful tree widget with selection, folding, and scrollbar support.
# The widget implements both `Widget` (stateless) and `StatefulWidget`
# (stateful with `TreeState`). See `crates/tornado-tree-widget/src/lib.rs`
# for the API surface.
tree = ["dep:tornado-tree-widget"]
# Round 9: aggregate log-building primitives from the three vendored
# sub-crates. Exposes `tornado::tab_log::TabLog` — the per-tab scroll
# log primitive lifted out of round-7's ScrollLogApp. Use cases:
# a multi-tab TuiApp (round 8), a single-pane log viewer with OSC 8
# anchors, anything else that wants a virtual-scroll log behind a
# status-bar surface.
log_view = [
    "dep:tornado-styles",
    "dep:tornado-scrollview",
    "dep:tornado-wrap",
]

# Integration tests — each gated on the feature it exercises, so
# consumers who don't enable that feature don't pay for the test
# (and the test's dependencies).

# tornado-styles: round-1 anstyle -> ratatui roundtrip.
[[test]]
name = "styles_integration"
required-features = ["styles"]

# tornado-hyperlink: OSC 8 encoding reach-through (cell 0 prefix).
[[test]]
name = "hyperlink_integration"
required-features = ["hyperlink"]

# tornado-spinner: frame advance via tick + StatefulWidget render path.
[[test]]
name = "spinner_integration"
required-features = ["spinner"]

# tornado-scrollview: offset advance + scrollbar visibility policy +
# viewport slicing through `tornado::scroller` re-export.
[[test]]
name = "scrollview_integration"
required-features = ["scroller"]

# Round 9: TabLog unit-tests live inside `crates/tornado/src/tab_log.rs`
# (inline `#[cfg(test)] mod tests`). Per design-memo D4 the helper is
# exercised at module level rather than as a separate integration
# binary, mirroring every vendored sibling crate's own test layout.

# Round 10 — vendored Sparkline round-trip tests through the
# umbrella. Companion tests live inline in
# `crates/tornado-sparkline/src/lib.rs#mod tests` and in
# `crates/tornado-sparkline/tests/sparkline_integration.rs`. The
# umbrella does not need a separate gateway `[[test]]` entry —
# the round-8 example mutation in `examples/multi-tab-log` is
# the umbrella-level end-to-end coverage that exercises the
# `sparkline` feature through `tornado::widget::Sparkline`.
